services:
  - type: web
    name: volve-ai-business-audit
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --prefix ai-audit-system
    startCommand: npm start --prefix ai-audit-system
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: audit-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: CALL_STORE_PATH
        value: /var/data/calls.sqlite
      - key: AUDIT_PHONE_NUMBER
        value: 1300 244 769
      - key: DEFAULT_INBOUND_INDUSTRY
        value: trades
      - key: AUDIT_MODEL
        value: claude-sonnet-4-6
      - key: AUDIT_MAX_TOKENS
        value: 5000
      - key: VOICE_MODEL
        value: claude-sonnet-4-6
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RETELL_API_KEY
        sync: false
      - key: RETELL_AGENT_ID
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: RETELL_WEBHOOK_URL
        sync: false
      - key: WORKBENCH_USERNAME
        sync: false
      - key: WORKBENCH_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
